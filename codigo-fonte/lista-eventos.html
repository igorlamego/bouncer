<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bouncer - Eventos Cadastrados</title>
    <link rel="stylesheet" href="./styles/lista-eventos-style.css">
    <script src="./scripts/data.js" defer></script>
    <script src="./scripts/auth.js" defer></script>
    <script src="./scripts/logout.js" defer></script>
    <script src="./scripts/lista-eventos.js" defer></script>
</head>
<body>
    <!-- CABEÇALHO -->
    <header class="topbar">
        <div class="logo">
            <img src="./assets/logo-clara.png" width="200" alt="Logo Bouncer">
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="nav-center">
            <a class="pill-btn" href="dashboard.html">PAINEL</a>
            <a class="pill-btn-current" href="lista-eventos.html">EVENTOS</a>
            <a class="pill-btn" href="guest-list.html">PARTICIPANTES</a>
        </nav>

        <div class="nav-right">
            <div class="profile">
                <div class="avatar"></div>
                <div class="profile-name"></div>
            </div>
            <a href="#" onclick="logout(); return false;" class="pill-btn logout-btn">SAIR</a>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main>
        <h1>Eventos Cadastrados</h1>
        <h2 class="subtitle">Lista de todos os eventos disponíveis</h2>

        <div class="add-event-container">
            <a class="create-btn" href="#">
                <span class="plus">＋</span>
                <span>Criar Evento</span>
            </a>
        </div>

        <section class="event-list">
        </section>

        <div class="footer-spacer"></div>
    </main>

    <!-- RODAPÉ -->
<footer class="footer">
  <img class="footer-logo" src="assets/logo-escura.png" alt="Bouncer Logo Escura" width="30%">
  <div class="footer-socials">
    <a href="https://x.com/">
      <img src="assets/x-logo.png" width="24" alt="X (Twitter)">
    </a>
    <a href="https://instagram.com/">
      <img src="assets/instagram-logo.png" width="24" alt="Instagram">
    </a>
    <a href="https://linkedin.com/">
      <img src="assets/linkedin-logo.png" width="24" alt="LinkedIn">
    </a>
  </div>
</footer>

<!-- Add Event Modal -->
<div id="add-event-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Criar Novo Evento</h2>
      <button id="close-event-modal" class="close-btn">&times;</button>
    </div>
    
    <form id="add-event-form">
      <div class="form-group">
        <label for="event-title">Nome do Evento*</label>
        <input type="text" id="event-title" placeholder="Digite o nome do evento" required>
      </div>
      
      <div class="form-group">
        <label for="event-location">Local*</label>
        <input type="text" id="event-location" placeholder="Digite o local do evento" required>
      </div>
      
      <div class="form-group">
        <label for="event-date">Data*</label>
        <input type="date" id="event-date" required>
      </div>
      
      <div class="form-group">
        <label for="event-time">Horário*</label>
        <input type="time" id="event-time" required>
      </div>
      
      <div class="form-group">
        <label for="event-capacity">Número de pessoas</label>
        <input type="number" id="event-capacity" min="1" placeholder="Digite o número de pessoas">
      </div>
      
      <div class="form-group">
        <label for="event-flyer">Flyer</label>
        <input type="file" id="event-flyer" accept="image/*">
      </div>
      
      <div class="form-group">
        <label for="event-description">Descrição</label>
        <textarea id="event-description" placeholder="Descreva seu evento"></textarea>
      </div>
      
      <div class="form-actions">
        <button type="button" id="cancel-add-event" class="cancel-btn">Cancelar</button>
        <button type="submit" class="submit-btn">Salvar Evento</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
