<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncer - Evento</title>
    <link rel="stylesheet" href="./styles/evento-style.css">
    <script src="./scripts/data.js" defer></script>
    <script src="./scripts/auth.js" defer></script>
    <script src="./scripts/logout.js" defer></script>
    <script src="./scripts/evento.js" defer></script>

</head>

<body>

    <!-- CABEÇALHO -->
<header class="topbar">
  <div class="logo">
    <img src="assets/logo-clara.png" width="200" alt="Logo Bouncer">
  </div>

  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav class="nav-center">
    <a class="pill-btn" href="dashboard.html">PAINEL</a>
    <a class="pill-btn" href="lista-eventos.html">EVENTOS</a>
    <a class="pill-btn" href="guest-list.html">PARTICIPANTES</a>
  </nav>

  <div class="nav-right">
    <div class="profile">
      <div class="avatar"></div>
      <div class="profile-name"></div>
    </div>
    <a href="#" onclick="logout(); return false;" class="pill-btn logout-btn">SAIR</a>
  </div>
</header>

    <!-- CONTEÚDO -->
    <main class="event-page">

        <h1 id="event-title">Título do Evento</h1>
        <h2 class="subtitle" id="event-subtitle">Informações detalhadas do evento</h2>

        <section class="event-info">

            <div class="event-image" id="event-image" hidden>
                <img src="" alt="Flyer do evento" id="event-banner">
            </div>

            <div class="event-details">
                <p><strong>Data:</strong> <span id="event-date">-</span></p>
                <p><strong>Horário:</strong> <span id="event-time">-</span></p>
                <p><strong>Local:</strong> <span id="event-location">-</span></p>
                <p><strong>Descrição:</strong></p>
                <p id="event-description">-</p>

            </div>
        </section>

        <section class="event-ticket-section">
            <h2 class="subtitle">Lista de convidados</h2>
            <div class="ticket-box">
                <p><strong>Capacidade:</strong> <span id="event-capacity">-</span></p>
                <p><strong>Convidados na lista:</strong> <span id="event-guests">0</span></p>
                <p><strong>Presenças confirmadas:</strong> <span id="event-attended">0</span></p>
                <a class="pill-btn" id="event-guests-link" href="guest-list.html">Gerenciar participantes</a>
                <a class="pill-btn secondary" id="event-edit-link" href="lista-eventos.html">Editar evento</a>
            </div>
        </section>
        <div class="footer-spacer"></div>
    </main>

    <!-- RODAPÉ -->
  <footer class="footer">
    <img class="footer__logo" src="assets/logo-escura.png" alt="Bouncer Logo Escura" width="30%" />
    <div class="footer__socials">
      <a href="https://x.com/"><img src="assets/x-logo.png" width="24" alt="Twitter" /></a>
      <a href="https://instagram.com/"><img src="assets/instagram-logo.png" width="24" alt="Instagram" /></a>
      <a href="https://linkedin.com/"><img src="assets/linkedin-logo.png" width="24" alt="LinkedIn" /></a>
    </div>
  </footer>

</body>
</html>
