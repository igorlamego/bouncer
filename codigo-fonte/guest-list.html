<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Convidados - BOUNCER</title>
  <link rel="stylesheet" href="./styles/style-guest-list.css">
  <script src="./scripts/data.js" defer></script>
  <script src="./scripts/auth.js" defer></script>
  <script src="./scripts/logout.js" defer></script>
  <script src="./scripts/guest-list.js" defer></script>
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <img src="assets/logo-clara.png" width="200" alt="Logo Bouncer">
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-center">
      <a class="pill-btn" href="dashboard.html">PAINEL</a>
      <a class="pill-btn" href="lista-eventos.html">EVENTOS</a>
      <a class="pill-btn-current" href="guest-list.html">PARTICIPANTES</a>
    </nav>

    <div class="nav-right">
      <div class="profile">
        <div class="avatar"></div>
        <div class="profile-name"></div>
      </div>
      <a href="#" onclick="logout(); return false;" class="pill-btn logout-btn">SAIR</a>
    </div>
  </header>


  <main class="page-content">
  <div class="page-top">
    <div class="titles">
      <h1 class="title">Lista de Participantes</h1>
      <p class="subtitle">Gerenciar convidados</p>
    </div>

    <div class="add-guest-wrap">
      <a class="add-btn" href="#">
          <span class="plus">＋</span>
        <span>Adicionar Participante</span>
      </a>
    </div>
  </div>

    <div class="card select-event-card">
      <label for="event-select">Selecionar Evento</label>
      <select id="event-select" class="event-select">
        <option>Carregando eventos...</option>
      </select>
      <div class="big-total">
        <div id="participants-total" class="metric">0</div>
        <div class="muted">confirmados</div>
      </div>
    </div>

    <div class="card guests-card">
    <div class="search-card">
      <input type="search" id="guest-search" placeholder="Buscar por nome, contato ou promoter" aria-label="Buscar participante" />
      <button id="filters-toggle" type="button">Filtros</button>
    </div>
      <table id="guests-table" class="guests-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th class="col-event">Evento</th>
            <th>Contato</th>
            <th>Categoria</th>
            <th>Status</th>
            <th>Promoter</th>
            <th>Observações</th>
            <th class="col-actions">Ações</th>
          </tr>
        </thead>
        <tbody id="guests-tbody"></tbody>
      </table>

    <div id="load-more-wrap" style="text-align:center; margin-top:12px;">
      <button id="load-more-btn" class="muted-link">ver mais</button>
    </div>
    </div>

    <div id="filter-popout" class="filter-popout">

      <div class="popout-header">
        <h2>Filtros</h2>
        <button id="close-filters" class="close-btn">x</button>
      </div>

      <div class="popout-content">

        <label for="filter-category">Categoria</label>
        <select id="filter-category">
          <option value="">Todas</option>
          <option value="VIP">VIP</option>
          <option value="Lista">Lista</option>
          <option value="Cortesia">Cortesia</option>
        </select>

        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">Todos</option>
          <option value="present">Confirmados</option>
          <option value="absent">Pendentes</option>
        </select>
      </div>

      <button id="apply-filters" class="apply-btn" type="button">Aplicar Filtros</button>
      <button id="clear-filters" class="clear-filters-btn" type="button">Limpar filtros</button>
    </div>

  <div class="footer-spacer"></div>

  </main>

  <footer class="footer">
    <img class="footer-logo" src="assets/logo-escura.png" alt="Bouncer Logo Escura" width="30%">
    <div class="footer-socials">
      <a href="https://x.com/">
        <img src="assets/x-logo.png" width="24" alt="X (Twitter)">
      </a>
      <a href="https://instagram.com/">
        <img src="assets/instagram-logo.png" width="24" alt="Instagram">
      </a>
      <a href="https://linkedin.com/">
        <img src="assets/linkedin-logo.png" width="24" alt="LinkedIn">
      </a>
    </div>
  </footer>

  <!-- Add Guest Modal -->
<div id="add-guest-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="guest-modal-title">Adicionar Participante</h2>
      <button id="close-modal" class="close-btn" type="button" aria-label="Fechar">&times;</button>
    </div>
    
    <form id="add-guest-form">
      <div class="form-group">
        <label for="guest-event">Evento*</label>
        <select id="guest-event" required></select>
      </div>

      <div class="form-group">
        <label for="guest-name">Nome*</label>
        <input type="text" id="guest-name" placeholder="Digite o nome do participante" required>
      </div>
      
      <div class="form-group">
        <label for="guest-contact">Contato</label>
        <input type="text" id="guest-contact" placeholder="Telefone ou email">
      </div>
      
      <div class="form-group">
        <label for="guest-category">Categoria</label>
        <select id="guest-category">
          <option value="">Selecionar categoria</option>
          <option value="VIP">VIP</option>
          <option value="Lista">Lista</option>
          <option value="Cortesia">Cortesia</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="guest-promoter">Promoter</label>
        <input type="text" id="guest-promoter" placeholder="Nome do promoter">
      </div>
      
      <div class="form-group">
        <label for="guest-notes">Observações</label>
        <textarea id="guest-notes" placeholder="Notas adicionais"></textarea>
      </div>
      
      <div class="form-actions">
        <button type="button" id="cancel-add-guest" class="cancel-btn">Cancelar</button>
        <button type="submit" class="submit-btn">Salvar Participante</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
