<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Participante | BOUNCER</title>
  <link rel="stylesheet" href="./styles/novo-evento-style.css">
</head>
<body>
  <!-- NAVBAR -->
  <header class="topbar">
    <div class="logo">
      <img src="assets/logo-clara.png" width="200em">
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-center">
      <button class="pill-btn">PAINEL</button>
      <button class="pill-btn">EVENTOS</button>
      <button class="pill-btn">PARTICIPANTES</button>
    </nav>

    <div class="nav-right">
      <div class="profile">
        <div class="avatar">E</div>
        <div class="profile-name">Eduardo</div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main>
    <h1>Novo Participante</h1>
    <p class="subtitle">Cadastre aqui os participantes dos seus eventos.</p>

    <div class="form-container">
      <div class="form-header">
        ➕ Cadastrar Participante
      </div>
      <form>
        <div>
          <label>Nome do Participante*</label>
          <input type="text" placeholder="Digite o nome completo" required>
        </div>
        <div>
          <label>E-mail</label>
          <input type="email" placeholder="Digite o e-mail">
        </div>
        <div>
          <label>Telefone</label>
          <input type="text" placeholder="(00) 00000-0000">
        </div>
        <div>
          <label>CPF</label>
          <input type="text" placeholder="000.000.000-00">
        </div>
        <div>
          <label>Categoria</label>
          <select>
            <option value="" disabled selected>Selecione</option>
            <option>Convidado</option>
            <option>Inscrito</option>
            <option>Pagante</option>
            <option>VIP</option>
            <option>Equipe</option>
          </select>
        </div>
        <div>
          <label>Comprovante (pagamento/inscrição)</label>
          <input type="file" accept="image/*,application/pdf">
        </div>
        <div class="descricao">
          <label>Observações</label>
          <textarea placeholder="Digite informações adicionais"></textarea>
        </div>
        <div class="btn-save">
          <button type="submit"> + Salvar Participante</button>
        </div>
      </form>
      <small>* Campos obrigatórios</small>
    </div>
    <div class="footer-space"></div>
  </main>

  <!-- RODAPÉ -->
  <footer class="footer">
    <img class="footer-logo" src="logo-escura.png" alt="Bouncer Logo Escura" width="30%">
    <div class="footer-socials">
      <a href="https://x.com/">
        <img src="x-logo.png" width="24px">
      </a>
      <a href="https://instagram.com/">
        <img src="instagram-logo.png" width="24px">
      </a>
      <a href="https://linkedin.com/">
        <img src="linkedin-logo.png" width="24px">
      </a>
    </div>
  </footer>
</body>
</html>
