<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Participante | BOUNCER</title>

  <!-- CSS base -->
  <link rel="stylesheet" href="./styles/novo-evento-style.css">

  <!-- CSS específico desta página -->
  <link rel="stylesheet" href="./styles/cadastro-participantes.css">
</head>
<body>
  <!-- NAVBAR -->
  <header class="topbar">
    <div class="logo">
      <img src="assets/logo-clara.png" width="200em" alt="BOUNCER">
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-center">
      <button class="pill-btn">PAINEL</button>
      <button class="pill-btn">EVENTOS</button>
      <button class="pill-btn">PARTICIPANTES</button>
    </nav>

    <div class="nav-right">
      <div class="profile">
        <div class="avatar">C</div>
        <div class="profile-name">Clóvis</div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main>
    <h1>Novo Participante</h1>
    <p class="subtitle">Cadastre participantes de todos os tipos: convidados, inscritos ou pagantes.</p>

    <div class="form-container">
      <div class="form-header">➕ Adicionar Participante</div>

      <form id="form-participante">
        <div>
          <label for="nome">Nome do Participante*</label>
          <input id="nome" name="nome" type="text" placeholder="Digite o nome do participante" required>
        </div>

        <div>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="nome@exemplo.com">
        </div>

        <div>
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="text" placeholder="(00) 00000-0000">
        </div>

        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00">
        </div>

        <div>
          <label for="categoria">Categoria do Participante</label>
          <select id="categoria" name="categoria">
            <option value="" disabled selected>Selecionar categoria</option>
            <option>Convidado</option>
            <option>Inscrito</option>
            <option>Pagante</option>
            <option>VIP</option>
            <option>Equipe</option>
          </select>
        </div>

        <div>
          <label for="comprovante">Comprovante (pagamento/inscrição)</label>
          <input id="comprovante" name="comprovante" type="file" accept="image/*,application/pdf">
        </div>

        <div class="descricao">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" placeholder="Descreva observações sobre o participante"></textarea>
        </div>

        <div class="btn-save">
          <button type="submit"> + Cadastrar participante</button>
        </div>
      </form>

      <small>* Campo obrigatório</small>
    </div>

    <div class="footer-space"></div>
  </main>

  <!-- RODAPÉ -->
  <footer class="footer">
    <img class="footer-logo" src="assets/logo-escura.png" alt="Bouncer Logo Escura" width="30%">
    <div class="footer-socials">
      <a href="https://x.com/"><img src="assets/x-logo.png" width="24" alt="X"></a>
      <a href="https://instagram.com/"><img src="assets/instagram-logo.png" width="24" alt="Instagram"></a>
      <a href="https://linkedin.com/"><img src="assets/linkedin-logo.png" width="24" alt="LinkedIn"></a>
    </div>
  </footer>

  <!-- aqui depois vamos linkar o JavaScript -->
  <script src="cadastro-participantes.js"></script>
</body>
</html>
