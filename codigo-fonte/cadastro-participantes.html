      <form id="form-participante">

          <input id="nome" type="text" placeholder="Digite o nome do participante" required />

        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="nome@exemplo.com" />

        <div>

          <input id="telefone" type="text" placeholder="(00) 00000-0000" />
        </div>

        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" type="text" placeholder="000.000.000-00" />
        </div>
