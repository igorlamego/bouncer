<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncer - Cadastro de Participantes</title>
  <link rel="stylesheet" href="./styles/cadastro-participantes-styles.css">
</head>

<body>

  <header>
    <h1>Bouncer</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="novo-evento.html">Cadastrar Evento</a>
      <a href="lista-eventos.html">Lista de Eventos</a>
      <a href="cadastro-participantes.html" class="active">Cadastrar Participantes</a>
      <a href="lista-participantes.html">Lista de Participantes</a>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Cadastro de Participantes</h2>

      <form id="form-participante">
        
        <div>
          <label for="nome">Nome Completo*</label>
          <input id="nome" type="text" placeholder="Digite o nome" required>
        </div>

        <div>
          <label for="email">E-mail*</label>
          <input id="email" type="email" placeholder="email@exemplo.com" required>
        </div>

        <div>
          <label for="telefone">Telefone*</label>
          <input id="telefone" type="tel" placeholder="(11) 90000-0000" required>
        </div>

        <div>
          <label for="cpf">CPF</label>
          <input id="cpf" type="text" placeholder="000.000.000-00">
        </div>

        <!-- 🔥 CAMPO DE EVENTO ADICIONADO AQUI -->
        <div>
          <label for="evento">Evento associado*</label>
          <select id="evento" required>
            <option value="" disabled selected>Selecione um evento</option>
          </select>
        </div>

        <div>
          <label for="categoria">Categoria do Participante</label>
          <select id="categoria">
            <option value="" disabled selected>Selecionar categoria</option>
            <option>Convidado</option>
            <option>Inscrito</option>
            <option>Pagante</option>
            <option>VIP</option>
            <option>Equipe</option>
          </select>
        </div>

        <button type="submit" class="btn">Cadastrar Participante</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Bouncer © 2025 - Todos os direitos reservados</p>
  </footer>

  <script src="./scripts/cadastro-participantes.js"></script>
</body>

</html>
