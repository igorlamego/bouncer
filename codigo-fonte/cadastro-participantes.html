<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Participante | BOUNCER</title>
  <link rel="stylesheet" href="./styles/cadastro-participantes.css">
</head>
<body>
  <!-- NAVBAR -->
  <header class="topbar">
    <div class="logo">
      <img src="assets/logo-clara.png" width="200em">
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-center">
      <button class="pill-btn">PAINEL</button>
      <button class="pill-btn">EVENTOS</button>
      <button class="pill-btn">PARTICIPANTES</button>
    </nav>

    <div class="nav-right">
      <div class="profile">
        <div class="avatar">C</div>
        <div class="profile-name">Clóvis</div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main>
    <h1>Novo Participante</h1>
    <p class="subtitle">Cadastre participantes de todos os tipos: convidados, inscritos ou pagantes.</p>

    <div class="form-container">
      <div class="form-header">
        👤 Adicionar Participante
      </div>
      <form id="participant-form">
        <div>
          <label for="nome">Nome do Participante*</label>
          <input type="text" id="nome" placeholder="Digite o nome do participante" required>
        </div
